name: Firestore Security Rules Tests
on:
  push:
    paths:
      - 'firestore.rules'
      - 'navigation.js'
      - 'firebase-requests.js'
      - 'booking-time.mjs'
      - 'index.html'
      - 'sw.js'
      - 'styles.css'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'functions/**'
      - 'firebase-push.js'
      - 'firebase-activity.js'
      - 'firebase-homes.js'
      - 'firebase-auth.js'
      - 'push-config.js'
      - 'firebase-notification-queue.js'
      - 'cloudflare/**'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/**'
      - 'package.json'
      - 'functions/**'
      - 'firebase-*.js'
      - 'push-config.js'
      - 'cloudflare/**'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:
jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check navigation.js
          node --check firebase-requests.js
          node --check booking-time.mjs
          node --check tests/booking-time.test.mjs
          node --check firebase-members.js
          node --check firebase-homes.js
          node --check firebase-auth.js
          node --check tests/firestore.rules.test.mjs
          node --check firebase-push.js
          node --check firebase-activity.js
          node --check functions/index.js
          node --check functions/account.js
          node --check functions/activity.js
          node --check firebase-notification-queue.js
          node --check cloudflare/worker.js
          node --check tests/cloudflare.worker.test.mjs
      - name: Booking duration and RTL picker regression tests
        run: node --test tests/booking-time.test.mjs
      - name: Cloudflare Worker smoke tests
        run: node --test tests/cloudflare.worker.test.mjs
      - run: npm run test:rules
