name: Firestore Security Rules Tests
on:
  push:
    paths:
      - 'firestore.rules'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:
jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check firebase-requests.js
          node --check firebase-members.js
          node --check firebase-homes.js
          node --check firebase-auth.js
          node --check tests/firestore.rules.test.mjs
      - run: npm run test:rules
